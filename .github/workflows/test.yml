# CI for this repository only. The relay workflow itself lives in template/ so it does
# NOT run on this repo's issues — you copy it into your own channel repo.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check examples/consumer-loop.js
